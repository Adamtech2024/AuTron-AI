[project]
name = "autron-ai"
version = "0.1.0"
description = "AuTron AI - Local AI assistant models"
requires-python = ">=3.9"
dependencies = [
    "ollama",
    "duckduckgo-search",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-config=pyproject.toml"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".git/*"]

[tool.coverage.report]
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
